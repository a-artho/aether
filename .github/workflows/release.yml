name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the IPA after validation
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Regression checks
        run: |
          python3 Tests/Regression/run-release-checks.py
          python3 Tests/Regression/run-aether-update-checks.py
          bash Tests/Regression/run.sh

      - name: Prepare native pairing library
        env:
          AETHER_NATIVE_IOS_ONLY: '1'
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL https://sh.rustup.rs -o "$RUNNER_TEMP/aether-rustup-init.sh"
            sh "$RUNNER_TEMP/aether-rustup-init.sh" -y --profile minimal --no-modify-path
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          RUSTUP_TOOLCHAIN=stable make native

      - name: Build fresh unsigned iPhone app
        run: |
          make deps
          xcodebuild -project Aether.xcodeproj -scheme Aether \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/AetherRelease" -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= AD_HOC_CODE_SIGNING_ALLOWED=NO DEPLOYMENT_LOCATION=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          cp deps/* "$RUNNER_TEMP/AetherRelease/Build/Products/Release-iphoneos/Aether.app/"

      - name: Package and verify unsigned IPA
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$RUNNER_TEMP/AetherRelease/Build/Products/Release-iphoneos/Aether.app/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 scripts/package-unsigned.py \
            "$RUNNER_TEMP/AetherRelease/Build/Products/Release-iphoneos/Aether.app" \
            packages/Aether.ipa --version "$VERSION"

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'Release tag does not match app version' >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" packages/Aether.ipa --clobber
          else
            gh release create "$TAG" packages/Aether.ipa --target "$GITHUB_SHA" \
              --title "Aether $VERSION" --notes-file "docs/releases/$VERSION.md"
          fi

      - name: Update Aether app repository manifest
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          RELEASE_DATE="$(gh release view "$TAG" --json publishedAt --jq '.publishedAt // empty')"
          ASSET_SIZE="$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.name == "Aether.ipa") | .size][0] // empty')"
          if [[ -z "$RELEASE_DATE" || -z "$ASSET_SIZE" ]]; then
            echo "Published release $TAG is missing its publication date or Aether.ipa asset" >&2
            exit 1
          fi
          gh release view "$TAG" --json body --jq '.body // ""' > "$RUNNER_TEMP/aether-release-notes.md"

          MANIFEST_WORKTREE="$RUNNER_TEMP/AetherManifest"
          git fetch origin main
          git worktree add --detach "$MANIFEST_WORKTREE" origin/main
          trap 'git worktree remove --force "$MANIFEST_WORKTREE"' EXIT
          git -C "$MANIFEST_WORKTREE" config user.name "github-actions[bot]"
          git -C "$MANIFEST_WORKTREE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git -C "$MANIFEST_WORKTREE" reset --hard origin/main
            python3 "$GITHUB_WORKSPACE/scripts/update-app-repo.py" \
              "$MANIFEST_WORKTREE/app-repo.json" \
              --version "$VERSION" \
              --date "$RELEASE_DATE" \
              --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Aether.ipa" \
              --size "$ASSET_SIZE" \
              --notes-file "$RUNNER_TEMP/aether-release-notes.md"
            git -C "$MANIFEST_WORKTREE" add app-repo.json
            if git -C "$MANIFEST_WORKTREE" diff --cached --quiet; then
              echo "Aether app repository already reflects $VERSION"
              exit 0
            fi
            git -C "$MANIFEST_WORKTREE" commit -m "chore: update Aether app repository for $TAG"
            if git -C "$MANIFEST_WORKTREE" push origin HEAD:main; then
              exit 0
            fi
            echo "Manifest push attempt $attempt failed; retrying from the latest main."
          done
          echo "Could not update app-repo.json after three attempts." >&2
          exit 1

name: Create Feature Request
description: Suggest a feature to be implemented to Aether.
title: '[Feature] '
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: >-
        Check for an existing issue before opening a new one.

  - type: textarea
    id: text
    attributes:
      label: Request
    validations:
      required: true

  - type: checkboxes
    id: agreement
    attributes:
      label: Request Agreement
      options:
        - label: I have read the requirements for opening an issue above
          required: true

  - type: checkboxes
    id: agreement2
    attributes:
      label: Contributor Checks
      options:
        - label: I am willing to attempt to make a pull request with these requested features
          required: false

name: Create Blank Issue
description: Blank issue report for Aether. Use this for anything other than a bug or feature request.

body:
  - type: markdown
    attributes:
      value: >-
        Check for an existing issue before opening a new one.

  - type: textarea
    id: text
    attributes:
      label: Content
    validations:
      required: true

  - type: checkboxes
    id: agreement
    attributes:
      label: Request Agreement
      options:
        - label: I have read the requirements for opening an issue above
          required: true
